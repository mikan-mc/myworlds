<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LSの配布ワールド</title>
        <link rel="stylesheet" href="css/stylesheet.css"></link>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="js/app.js"></script>
    </head>
    <body>
        <div class="header">
            <h1 class="header-title"> 配布ワールド一覧 </h1>
        </div>
        <a class="header-help-button" href="#">Q.導入方法</a>
        <div class="containerr">
            <div class="worlds-container">
            </div>
        </div>
        <div class="footer">
            <p>配布しているワールドはすべて Java Edition 専用です。</p>
        </div>
        <div class="helpbox-container" style="display: none;">
            <a class="helpbox-close" href="#">
            </a>
            <div class="helpbox">
                <h3>ワールドデータ 導入方法</h3>
                <p>①　ダウンロードしたワールドデータを右クリックして「すべて展開」をクリック</p>
                <div class="helpbox-image-container">
                    <img class="helpbox-image" src="./images/helpbox/worlddata1.png" loading="lazy"></img>
                </div>
                <p>②　Minecraftを起動する</p>
                <div class="helpbox-image-container">
                    <img class="helpbox-image" src="./images/helpbox/title_screen.png" loading="lazy"></img>
                </div>
                <p>③「設定」→「リソースパック」を選択</p>
                <div class="helpbox-image-container">
                    <img class="helpbox-image" src="./images/helpbox/resource_pack.png" loading="lazy"></img>
                </div>
                <p>④「パックフォルダーを開く」をクリック</p>
                <div class="helpbox-image-container">
                    <img class="helpbox-image" src="./images/helpbox/worlddata4.png" loading="lazy"></img>
                </div>
                <p>⑤　開いたフォルダーの1つ前のページを開く</p>
                <div class="helpbox-image-container">
                    <img class="helpbox-image" src="./images/helpbox/worlddata5.png" loading="lazy"></img>
                </div>
                <p>⑥ ①で展開したワールドデータを「saves」に入れる</p>
                <div class="helpbox-image-container">
                    <img class="helpbox-image" src="./images/helpbox/worlddata6.png" loading="lazy"></img>
                </div>
                <h3>これで導入完了です</h3>
            </div>
        </div>
    </body>
</html>
